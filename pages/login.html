<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | Piggy</title>
  <meta name="description" content="Acesse sua conta Piggy para acompanhar sua vida financeira.">
  <meta name="theme-color" content="#07121f">
  <meta property="og:title" content="Entrar | Piggy">
  <meta property="og:description" content="Acesse sua conta Piggy para acompanhar sua vida financeira.">
  <meta property="og:type" content="website">
    <link rel="stylesheet" href="../global.css">
    <link rel="stylesheet" href="login.css">
    <link rel="icon" href="../PIGGY-logo.png" type="image/png">
</head>
<body class="login-body">
  <a class="skip-link" href="#main-content">Pular para o conteúdo</a>

    <main class="login-page" id="main-content">
        <div class="login-container">
            <a href="Sidebar/Dashboard/index.html" class="login-logo" aria-label="Voltar ao dashboard"><img src="../PIGGY-logo.png" alt="Piggy" width="140" height="36"></a>
            <h1>Entre na sua conta</h1>
            <form id="loginForm" novalidate>
                <div class="name-group">
                    <div class="input-group">
                        <label for="name">Nome</label>
                        <input type="text" id="name" name="name" autocomplete="given-name" placeholder="Digite seu nome" aria-describedby="nameError" required>
                        <div class="error" id="nameError" aria-live="polite"></div>
                    </div>
    
                    <div class="input-group">
                        <label for="surname">Sobrenome</label>
                        <input type="text" id="surname" name="surname" autocomplete="family-name" placeholder="Digite seu sobrenome" aria-describedby="surnameError" required>
                        <div class="error" id="surnameError" aria-live="polite"></div>
                    </div>
                </div>

                <div class="input-group">
                    <label for="phone">Telefone</label>
                    <input type="tel" id="phone" name="phone" inputmode="tel" autocomplete="tel" placeholder="(XX) XXXXX-XXXX" maxlength="15" pattern="\(\d{2}\)\s\d{5}-\d{4}" aria-describedby="phoneError" required>
                    <div class="error" id="phoneError" aria-live="polite"></div>
                </div>

                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" autocomplete="email" placeholder="email@gmail.com" aria-describedby="emailError" required>
                    <div class="error" id="emailError" aria-live="polite"></div>
                </div>
                <div class="input-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Digite sua senha" minlength="8" maxlength="25" pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[#?!@$%^&amp;*-]).{8,}$" title="A senha deve conter pelo menos 8 caracteres, incluindo letras maiúsculas, minúsculas, números e caracteres especiais." aria-describedby="passwordError" required>
                    <div class="error" id="passwordError" aria-live="polite"></div>
                </div>
                <div class="input checkbox">
                    <label>
                        <input type="checkbox" id="rememberMe" name="terms" required> Eu aceito os termos de uso
                    </label>
                </div>
               <button type="submit">Entrar</button>
               <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
            </form>
        </div>
    </main>

    <script src="../js/login.js" defer></script>
</body>
</html>
