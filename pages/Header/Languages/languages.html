      <span class="material-symbols-rounded icon-size-24" aria-hidden="true">menu</span>
    </button>

    <div class="header__actions">
      <a href="languages.html" class="header__lang-btn header__action-link" aria-label="Alterar idioma e região">
        <img src="./menu-bandeiras/bandeiradobrasi.webp" alt="" class="header__lang-img" width="28" height="20" decoding="async">
      </a>
      <button type="button" class="header__action-btn" aria-label="Mensagens"><span class="material-symbols-rounded icon-size-24" aria-hidden="true">mail</span></button>

      <a href="login.html" class="header__action-profile header__action-link" aria-label="Abrir perfil">
        <img src="./images/pawel-nolbert-P60WHK5CvUE-unsplash.jpg" alt="" class="header__profile-img" width="60" height="60" decoding="async">
        <span class="header__profile-alternate" aria-hidden="true"><span class="material-symbols-rounded icon-size-20" aria-hidden="true">unfold_more</span></span>
      </a>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar" aria-label="Navegação principal">
      <nav class="sidebar__nav">
        <div class="sidebar__group" role="list">
          <p class="sidebar__group-label">PRINCIPAL</p>
          <a href="index.html" class="sidebar__item"><span class="material-symbols-rounded icon-size-22" aria-hidden="true">home</span><span class="sidebar__item-label">Dashboard</span></a>
          <button type="button" class="sidebar__item" data-placeholder-action="true"><span class="material-symbols-rounded icon-size-22" aria-hidden="true">analytics</span><span class="sidebar__item-label">Análises</span></button>
          <a href="transitions.html" class="sidebar__item"><span class="material-symbols-rounded icon-size-22" aria-hidden="true">swap_horiz</span><span class="sidebar__item-label">Transações</span></a>
          <button type="button" class="sidebar__item" data-placeholder-action="true"><span class="material-symbols-rounded icon-size-22" aria-hidden="true">track_changes</span><span class="sidebar__item-label">Metas</span></button>
          <a href="piggy.html" class="sidebar__item"><span class="material-symbols-rounded icon-size-22" aria-hidden="true">savings</span><span class="sidebar__item-label">Piggy</span></a>
          <button type="button" class="sidebar__item" data-placeholder-action="true"><span class="material-symbols-rounded icon-size-22" aria-hidden="true">receipt_long</span><span class="sidebar__item-label">Faturas</span></button>
        </div>

        <div class="sidebar__group" role="list">
          <p class="sidebar__group-label">GERENCIAMENTO</p>

        <div class="sidebar__group" role="list">
          <p class="sidebar__group-label">GERAL</p>

          <button type="button" class="sidebar__item" data-placeholder-action="true"><span class="material-symbols-rounded icon-size-22" aria-hidden="true">help</span><span class="sidebar__item-label">Ajuda</span></button>
          <button type="button" class="sidebar__item" data-placeholder-action="true"><span class="material-symbols-rounded icon-size-22" aria-hidden="true">devices</span><span class="sidebar__item-label">Dispositivos</span></button>
          <button type="button" class="sidebar__item logout" data-placeholder-action="true"><span class="material-symbols-rounded icon-size-22" aria-hidden="true">logout</span><span class="sidebar__item-label">Sair</span></button>

      <button type="button" class="sidebar__collapse-btn" aria-label="Recolher menu" aria-expanded="true">

    <button type="button" class="sidebar-backdrop" aria-label="Fechar menu" tabindex="-1"></button>
    <main class="main" id="main-content">

      <!-- Page header -->
      <div class="page-header">
        <h1 class="page-header__title">Idiomas</h1>
      </div>

      <div class="language-intro">
        <h2>Por favor, escolha uma região e língua</h2>
      </div>

      <div class="lg-header">
        <p class="region">Américas</p>
        <p class="region">Ásia</p>
        <p class="region">Europa, Oriente Médio e África</p>
      </div>

      <div class="language-selection">
        <h2 class="language-selection__title">Américas</h2>

        <div class="language-selector">
            <button type="button" class="language-selector__button" aria-pressed="true">Brasil <span>Português</span></button>
            
            <button type="button" class="language-selector__button">Argentina <span>Español</span></button>
            
            <button type="button" class="language-selector__button">México <span>Español</span></button>
            
            <button type="button" class="language-selector__button">Paraguai <span>Español</span></button>
            
            <button type="button" class="language-selector__button">Uruguai <span>Español</span></button>
            
            <button type="button" class="language-selector__button">United States <span>English</span></button>
        </div>
      
        <h2 class="language-selection__title">Ásia</h2>

        <div class="language-selector">
            <button type="button" class="language-selector__button">Australia <span>English</span></button>
            
            <button type="button" class="language-selector__button">New Zealand <span>English</span></button>
            
            <button type="button" class="language-selector__button">Philippines <span>English</span></button>
            
            <button type="button" class="language-selector__button">Singapore <span>English</span></button>
            
            <button type="button" class="language-selector__button">Malaysia <span>English</span></button>
            
            <button type="button" class="language-selector__button">日本 <span>日本語</span></button>
        </div>
      
        <h2 class="language-selection__title">Europa, Oriente Médio e África</h2>

        <div class="language-selector">
            <button type="button" class="language-selector__button">South Africa <span>English</span></button>
            
            <button type="button" class="language-selector__button">Suisse <span>Français</span></button>
            
            <button type="button" class="language-selector__button">Schweiz <span>Deutsch</span></button>
            
            <button type="button" class="language-selector__button">España <span>Español</span></button>
            
            <button type="button" class="language-selector__button">Belgique <span>Français</span></button>
            
            <button type="button" class="language-selector__button">United Kingdom <span>English</span></button>
        </div>
    </main>
    </div>
    
  <script src="./js/main.js" defer></script>
